[project]
name = "trace-document-ai"
version = "0.1.0"
description = "TRACE Contract Intelligence Platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-cloud-storage==2.18.2",
    "google-cloud-documentai==2.31.0",
    "google-cloud-dlp==3.22.0",
    "google-cloud-aiplatform==1.71.1",
    "google-genai>=1.0.0",
    "google-cloud-firestore==2.19.0",
    "google-cloud-bigquery==3.27.0",
    "fastapi==0.115.6",
    "uvicorn==0.32.1",
    "jinja2==3.1.4",
    "python-multipart==0.0.20",
    "pydantic==2.10.3",
    "python-dotenv==1.0.1",
    "pypdf==4.3.1",
]

[project.scripts]
trace-pipeline = "trace_ai.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
